on:
  schedule:
    # Alle 2 Stunden. GitHub fuehrt Cron-Jobs in UTC aus.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}   # Erlaubt manuelles Starten ueber den "Run workflow"-Knopf

permissions:
  contents: write   # Damit der Workflow Ergebnisse zurueck ins Repo schreiben darf

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Daten abrufen und Dashboard bauen
        run: python collector.py

      - name: Ergebnisse committen
        run: |
          git config user.name "vermarktungs-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json historie.xlsx index.html
          git diff --quiet --cached || git commit -m "Automatisches Update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
